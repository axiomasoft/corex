name: Set up PHP and Composer
description: Install PHP, restore the Composer download cache keyed by composer.lock, and install the locked root.

inputs:
  php-version:
    description: PHP version to install
    default: "8.4"
  extensions:
    description: Comma-separated PHP extensions
    default: "mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd"
  coverage:
    description: Coverage driver (none or pcov)
    default: none
  install:
    description: Run composer install for the root lockfile
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup PHP ${{ inputs.php-version }}
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        coverage: ${{ inputs.coverage }}
        tools: composer:v2

    - name: Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-php${{ inputs.php-version }}-${{ hashFiles('composer.lock', 'packages/*/composer.json', 'products/*/composer.json') }}
        restore-keys: composer-${{ runner.os }}-php${{ inputs.php-version }}-

    - name: Install locked dependencies
      if: inputs.install == 'true'
      shell: bash
      run: composer install --prefer-dist --no-interaction --no-progress
