version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: composer
    directories: ['/', '/packages/*']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      composer:
        patterns: ['*']
