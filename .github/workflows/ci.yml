      meilisearch:
        image: getmeili/meilisearch:v1.16
        env:
          MEILI_NO_ANALYTICS: 'true'
          MEILI_ENV: development
        ports:
          - 7700:7700
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd, xdebug
          coverage: xdebug

      - name: Install dependencies
        run: php scripts/ci-composer-update.php

      - name: Composer audit
        run: env -u COMPOSER_NO_AUDIT composer audit --locked

      - name: Prepare PostgreSQL test databases
        run: |
          for database in corex_test corex_search_a_test corex_search_b_test corex_budget_test corex_search_control_test; do
            PGPASSWORD=corex psql -h 127.0.0.1 -U corex -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '${database}'" | grep -q 1 \
              || PGPASSWORD=corex psql -h 127.0.0.1 -U corex -d postgres -c "CREATE DATABASE ${database}"
          done

      - name: Effective coverage floor
        run: |
          FLOOR="$(grep -m1 -E '^[0-9]+' scripts/coverage-min-floor.txt)"
          echo "Effective coverage floor (scripts/coverage-min-floor.txt): --min=${FLOOR}"
          echo "Return to --min=80 is time-gated item P1.27 (D47)."

      - name: Coverage
        run: composer test:coverage
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_BUDGET_DATABASE: corex_budget_test
          PGSQL_CONTROL_DATABASE: corex_search_control_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

  quality:
    permissions:
