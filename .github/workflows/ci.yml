# CI is a job graph, not a list:
#
#   changes → quality → { tests, PostgreSQL, packages, analysis, gates } → CI gate
#
# `changes` skips the PHP lanes when the branch differs from main only in
# Markdown, docs/ or LICENSE. It compares with main rather than with the
# previous push, so a cancelled run never hides a code change. Pushes to main
# and workflow_dispatch always run everything.
#
# `quality` is the fast fail (audit, manifest policy, strict validate, Pint,
# actionlint, zizmor); the PHP lanes start only after it passes. Rector and
# PHPStan take minutes, so they run in the parallel `Static analysis` lane.
# The supply-chain gates (anti-weakening, gitleaks, contract guard) start
# immediately.
#
# `CI gate` is the one check a branch rule should require: skipped lanes count
# as passed, failed or cancelled ones do not. Mutation testing runs on
# workflow_dispatch with `mutation: true`.

name: CI

on:
  push:
    branches:
      - main
      - refactor/**
      - feat/**
      - fix/**
      - hotfix/**
      - chore/**
  pull_request:
  workflow_dispatch:
    inputs:
      jobs:
        description: Only these job ids, comma-separated without spaces (empty runs every job), e.g. tests-pg,panels-tests
        type: string
        default: ''
      mutation:
        description: Also run the mutation inventory, fragments and registry
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COMPOSER_ROOT_VERSION: dev-main
  COMPOSER_NO_INTERACTION: '1'

jobs:

  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.plan.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Filter paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: main
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"
              - "!LICENSE"
          predicate-quantifier: every
      - name: Plan lanes
        id: plan
        env:
          FILTER_CODE: ${{ steps.filter.outputs.code }}
        run: |
          code="${FILTER_CODE:-true}"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          printf "### Changes\n\nPHP lanes run: %s\n" "$code" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
      - name: Composer audit
        run: env -u COMPOSER_NO_AUDIT composer audit --locked
      - name: Manifest policy
        run: python3 scripts/manifest-check.py
      - name: Strict validation of every installing root
        run: |
          for manifest in composer.json packages/*/composer.json products/*/composer.json; do
            composer validate --strict --no-check-lock --working-dir="$(dirname "$manifest")"
          done
      - name: Pint
        run: composer lint:check
      - name: Lint workflows
        uses: $/.github/actions/lint-workflows

  anti-weakening-gate:
    name: Anti-weakening gate
    if: (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',anti-weakening-gate,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Guard against gate-weakening diffs
        run: bash scripts/anti-weakening-gate.sh

  secret-scan:
    name: Secret scan (gitleaks)
    if: (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',secret-scan,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Secret scan gate
        run: GITLEAKS_BIN=/tmp/gitleaks bash scripts/secret-scan-gate.sh
      - name: Verify secret scan boundaries
        run: GITLEAKS_BIN=/tmp/gitleaks python3 -m unittest scripts.tests.test_secret_scan_gate

  contract-guard:
    name: Contract-snapshot guard
    if: (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',contract-guard,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Guard PHP surface snapshots against a CHANGELOG entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/contract-guard.sh "$BASE_SHA"

  tests:
    name: PHP ${{ matrix.php }}
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',tests,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
      - name: Tests
        run: composer test
      - name: Runtime globals gate
        run: composer runtime-globals-gate
      - name: Config cache check
        run: composer config-cache-check
      - name: Configuration reference
        run: composer configuration-reference

  octane-lifecycle:
    name: Octane source lifecycle · PHP ${{ matrix.php }}
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',octane-lifecycle,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
    env:
      OCTANE_PHP: ${{ matrix.php }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
          install: 'false'
      - name: Install locked Octane source consumer
        run: python3 scripts/composer-with-snapshots.py --working-dir=packages/core/tests/Release/octane-consumer update --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Receipt integrity controls
        run: python3 -m unittest discover -s scripts/quality/tests -p test_octane_proof.py
      - name: Real Octane Worker handlers
        run: python3 scripts/quality/octane-proof.py --source-root . --matrix "$OCTANE_PHP" --evidence-dir build/quality/octane

  tests-pg:
    name: PG lane (postgres:${{ matrix.postgres }})
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',tests-pg,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - '16'
          - '18'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U corex -d corex_test" --health-interval 5s --health-timeout 5s --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.16@sha256:c0c45cb82a96221d7c855d1cc36ca04ff4b3ce6330fbd8df5ba82e86e632a053
        env:
          MEILI_MASTER_KEY: corex-ci-disposable-meilisearch-key
          MEILI_NO_ANALYTICS: 'true'
          MEILI_ENV: development
        ports:
          - 7700:7700
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
      - name: Prepare PostgreSQL test databases
        run: |
          for database in corex_test corex_search_a_test corex_search_b_test corex_budget_test corex_search_control_test corex_sink_test; do
            PGPASSWORD=corex psql -h 127.0.0.1 -U corex -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '${database}'" | grep -q 1 \
              || PGPASSWORD=corex psql -h 127.0.0.1 -U corex -d postgres -c "CREATE DATABASE ${database}"
          done
      - name: PG tests
        run: composer test:pg
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_BUDGET_DATABASE: corex_budget_test
          PGSQL_CONTROL_DATABASE: corex_search_control_test
          PGSQL_SINK_DATABASE: corex_sink_test
          COREX_LIFECYCLE_CONTROL_DATABASE: corex_search_control_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex
          MEILISEARCH_HOST: http://127.0.0.1:7700
          MEILISEARCH_MASTER_KEY: corex-ci-disposable-meilisearch-key

  packages:
    name: Package · ${{ matrix.package }}
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',packages,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - operations
          - tools
          - webhooks
          - media
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
          coverage: pcov
      - name: Install the standalone package
        env:
          PACKAGE: ${{ matrix.package }}
        run: python3 scripts/composer-with-snapshots.py --working-dir="packages/$PACKAGE" update --prefer-dist --no-interaction --no-progress
      - name: Tests and coverage
        env:
          PACKAGE: ${{ matrix.package }}
        run: composer --working-dir="packages/$PACKAGE" test:coverage
      - name: Static analysis
        env:
          PACKAGE: ${{ matrix.package }}
        run: composer --working-dir="packages/$PACKAGE" analyse

  notifications-wakeup-tests:
    name: Notifications and wakeup packages
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',notifications-wakeup-tests,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
      - name: Wakeup tests
        run: composer --working-dir=packages/scheduler test
      - name: Notification tests
        run: composer --working-dir=packages/notifications test
      - name: Notification and wakeup static analysis
        run: |
          composer --working-dir=packages/notifications analyse
          composer --working-dir=packages/scheduler analyse

  notifications-pg-tests:
    name: Notifications package (PG18)
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',notifications-pg-tests,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U corex -d corex_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, pdo_pgsql, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
      - name: PostgreSQL delivery admission test
        run: composer --working-dir=packages/notifications test:pg
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

  panels-tests:
    name: Panels package
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',panels-tests,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      pgsql:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U corex -d corex_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, pdo_pgsql, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
          coverage: pcov
      - name: Install dependencies
        run: python3 scripts/composer-with-snapshots.py --working-dir=packages/panels update --prefer-dist --no-interaction --no-progress
      - name: Panels SQLite tests
        run: composer --working-dir=packages/panels test -- --exclude-group=pg
      - name: Panels tests and coverage
        run: composer --working-dir=packages/panels test:coverage
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex
      - name: Panels static analysis
        run: composer --working-dir=packages/panels analyse

  media-pg-tests:
    name: Media package (PG18)
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',media-pg-tests,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U corex -d corex_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, pdo_pgsql, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
      - name: Install dependencies
        run: python3 scripts/composer-with-snapshots.py --working-dir=packages/media update --prefer-dist --no-interaction --no-progress
      - name: Media PostgreSQL concurrency test
        run: composer --working-dir=packages/media test:pg
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

  tenancy-tests:
    name: Tenancy package (PG18)
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',tenancy-tests,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U corex -d corex_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd, redis
      - name: Install dependencies
        run: python3 scripts/composer-with-snapshots.py --working-dir=packages/tenancy update --prefer-dist --no-interaction --no-progress
      - name: Install PostgreSQL 18 client
        timeout-minutes: 8
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --connect-timeout 10 --max-time 60 --retry 3 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/pgdg.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 -o Acquire::Retries=3 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 -o Acquire::http::Timeout=30 install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
      - name: Tenancy tests
        run: composer --working-dir=packages/tenancy test
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex
          P3_REDIS_PORT: 6379
      - name: PHPStan (tenancy/src)
        run: composer --working-dir=packages/tenancy analyse

  crm-tests:
    name: Crm package
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',crm-tests,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PGSQL_PORT: 5432
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U corex -d corex_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
          coverage: pcov
      - name: Install dependencies
        run: python3 scripts/composer-with-snapshots.py --working-dir=products/flex-crm update --prefer-dist --no-interaction --no-progress
      - name: Crm tests
        run: composer --working-dir=products/flex-crm test
      - name: Crm PostgreSQL regressions
        run: composer --working-dir=products/flex-crm test:pg
      - name: Crm coverage
        run: composer --working-dir=products/flex-crm test:coverage

  packages-tests:
    name: Remaining cohort package aggregator
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',packages-tests,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
          coverage: pcov
      - name: Install access dependencies
        run: python3 scripts/composer-with-snapshots.py --working-dir=packages/access update --prefer-dist --no-interaction --no-progress
      - name: Per-package test aggregator
        run: composer test:packages
      - name: Core and modules SQLite suites
        run: vendor/bin/pest --exclude-group=pg packages/core/tests

  tasks-tests:
    name: Tasks package
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',tasks-tests,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U corex -d corex_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
          coverage: pcov
      - name: Install dependencies
        run: python3 scripts/composer-with-snapshots.py --working-dir=packages/tasks update --prefer-dist --no-interaction --no-progress
      - name: Tasks tests
        run: composer --working-dir=packages/tasks test
      - name: Tasks tests (PG18)
        run: composer --working-dir=packages/tasks test:pg
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex
      - name: Tasks coverage (floor 92%)
        run: composer --working-dir=packages/tasks test:coverage
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

  auth-tests:
    name: Auth package (AzGuard)
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',auth-tests,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U corex -d corex_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
      - name: Install dependencies
        run: python3 scripts/composer-with-snapshots.py --working-dir=packages/access update --prefer-dist --no-interaction --no-progress
      - name: Auth tests
        run: composer --working-dir=packages/access test
      - name: Auth tests (PG18, aut_* DDL)
        run: composer --working-dir=packages/access test:pg
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex
      - name: PHPStan (auth/src)
        run: composer --working-dir=packages/access analyse

  layer-gate:
    name: Layer & core-isolation gate
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',layer-gate,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
      - name: Architecture & layer rules (CoreX ↛ Flex, core isolation)
        run: composer test:arch
      - name: Source API surface report (classification debt is reported)
        run: composer php-api
      - name: Native Packman monorepo governance and contracts
        run: |
          scripts/php84 vendor/bin/packman gate
          scripts/php84 vendor/bin/packman php-api --check
          scripts/php84 vendor/bin/packman error-codes --check
          scripts/php84 vendor/bin/packman config-schema --check
      - name: Typed package error registry and literal gate
        run: composer error-registry
      - name: API contract compatibility
        run: composer api-contract
      - name: Feature-module layout
        run: |
          composer module-layout-gate
          python3 -m unittest discover -s scripts/tests -p 'test_module_layout_gate.py'
      - name: Migration table ownership
        run: composer table-ownership-gate
      - name: Shipped schema rules and registry manifest
        run: |
          composer schema-gate
          php scripts/schema-gate.php --check
      - name: Table write ownership
        run: |
          composer table-write-ownership-gate
          python3 -m unittest discover -s scripts/tests -p 'test_table_write_ownership_gate.py'

  coverage:
    name: Root coverage (min 80%)
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',coverage,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U corex -d corex_test" --health-interval 5s --health-timeout 5s --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.16@sha256:c0c45cb82a96221d7c855d1cc36ca04ff4b3ce6330fbd8df5ba82e86e632a053
        env:
          MEILI_MASTER_KEY: corex-ci-disposable-meilisearch-key
          MEILI_NO_ANALYTICS: 'true'
          MEILI_ENV: development
        ports:
          - 7700:7700
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
          coverage: pcov
      - name: Prepare PostgreSQL test databases
        run: |
          for database in corex_test corex_search_a_test corex_search_b_test corex_budget_test corex_search_control_test corex_sink_test; do
            PGPASSWORD=corex psql -h 127.0.0.1 -U corex -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '${database}'" | grep -q 1 \
              || PGPASSWORD=corex psql -h 127.0.0.1 -U corex -d postgres -c "CREATE DATABASE ${database}"
          done
      - name: Prepare report directory
        run: mkdir -p build
      - name: Coverage
        run: |
          set -o pipefail
          composer test:coverage | tee build/coverage.log
          { echo "### Root coverage"; echo; echo '```'; tail -n 5 build/coverage.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_BUDGET_DATABASE: corex_budget_test
          PGSQL_CONTROL_DATABASE: corex_search_control_test
          PGSQL_SINK_DATABASE: corex_sink_test
          COREX_LIFECYCLE_CONTROL_DATABASE: corex_search_control_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex
          MEILISEARCH_HOST: http://127.0.0.1:7700
          MEILISEARCH_MASTER_KEY: corex-ci-disposable-meilisearch-key
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: root-coverage
          path: |
            build/root-coverage
            build/coverage.log
          retention-days: 14
          if-no-files-found: ignore

  quality:
    name: Static analysis
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',quality,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
      - name: Install access dependencies
        run: python3 scripts/composer-with-snapshots.py --working-dir=packages/access update --prefer-dist --no-interaction --no-progress
      - name: PHPStan
        run: composer analyse
      - name: Zero PHPStan debt across all packages and consumers
        run: php scripts/quality/release-quality.php --stage=all
      - name: Unused public entrypoints
        run: php scripts/quality/unused-public.php --check
      - name: Quality gate negative controls and native Rector provenance
        run: vendor/bin/pest tests/Arch/UnusedPublicGateTest.php tests/Arch/QualityReleaseGateTest.php tests/Arch/MigrationToolingGuardTest.php tests/Arch/RectorLaravelSubsetTest.php
      - name: Composer source audit controls
        run: python3 -m unittest discover -s scripts/distribution/tests -q
      - name: Audit every maintained Composer source root
        run: env -u COMPOSER_NO_AUDIT python3 scripts/distribution/audit-roots.py --scope source --evidence-dir build/quality/audits
      - name: PHPStan (modules-lint on tests/)
        run: composer analyse:tests-lint
      - name: Rector
        run: composer refactor:check

  golden:
    name: Golden surface and wire contracts
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',golden,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
      - name: Golden snapshots
        run: composer golden

  ownership:
    name: Package identifier ownership
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',ownership,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
      - name: Strict ownership
        run: php scripts/ownership-gate.php --strict
      - name: Rename completeness
        run: php scripts/rename-completeness-gate.php

  dependencies:
    name: Standalone dependencies and lockfile audits
    needs:
      - changes
      - lint
    if: needs.changes.outputs.code == 'true' && (!inputs.jobs || contains(format(',{0},', inputs.jobs), ',dependencies,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
      - name: Analyse every standalone package
        run: bash scripts/dependency-analyser.sh --all
      - name: Audit every standalone package lockfile
        run: |
          for manifest in packages/*/composer.json products/*/composer.json; do
            env -u COMPOSER_NO_AUDIT python3 scripts/composer-with-snapshots.py --working-dir="$(dirname "$manifest")" audit --locked
          done

  mutation-inventory:
    name: Mutation inventory and parser controls
    if: github.event_name == 'workflow_dispatch' && inputs.mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.fragments.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
      - name: Exhaustive fragments and AST declaration ledger
        run: python3 scripts/quality/mutation.py --inventory --check
      - name: Strict parser negative controls
        run: python3 scripts/quality/mutation.py --self-test
      - name: Materialize package-fragment shards
        id: fragments
        run: echo "matrix=$(python3 scripts/quality/mutation.py --matrix)" >> "$GITHUB_OUTPUT"

  mutation-fragments:
    name: MSI · ${{ matrix.package }} · ${{ matrix.zone }}
    needs: mutation-inventory
    if: github.event_name == 'workflow_dispatch' && inputs.mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.mutation-inventory.outputs.matrix) }}
    env:
      MUTATION_PACKAGE: ${{ matrix.package }}
      MUTATION_ZONE: ${{ matrix.zone }}
      PGSQL_HOST: 127.0.0.1
      PGSQL_PORT: '5432'
      PGSQL_USERNAME: corex
      PGSQL_PASSWORD: corex
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U corex -d corex_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd, pcntl
          coverage: pcov
      - name: Measure full package-fragment MSI
        run: python3 scripts/quality/mutation.py --package "$MUTATION_PACKAGE" --zone "$MUTATION_ZONE"
      - name: Retain raw mutant processes and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.package }}-${{ matrix.zone }}
          path: |
            build/quality/mutation/**/receipt.json
            build/quality/mutation/**/processes/**
            build/quality/mutation/**/invalid/**
            build/quality/mutation/**/sqlite/**
            build/quality/mutation/**/pgsql/**
          retention-days: 7

  mutation-check:
    name: Mutation registry (scripts/mutation-check.sh --all)
    if: github.event_name == 'workflow_dispatch' && inputs.mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U corex -d corex_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
      - name: Mutation registry — every case must red under sabotage
        run: bash scripts/mutation-check.sh --all
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

  ci-gate:
    name: CI gate
    needs:
      - changes
      - lint
      - anti-weakening-gate
      - secret-scan
      - contract-guard
      - tests
      - octane-lifecycle
      - tests-pg
      - packages
      - notifications-wakeup-tests
      - notifications-pg-tests
      - panels-tests
      - media-pg-tests
      - tenancy-tests
      - crm-tests
      - packages-tests
      - tasks-tests
      - auth-tests
      - layer-gate
      - coverage
      - quality
      - golden
      - ownership
      - dependencies
      - mutation-inventory
      - mutation-fragments
      - mutation-check
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          failed = {name: job["result"] for name, job in needs.items() if job["result"] not in ("success", "skipped")}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## CI gate\n\n| Job | Result |\n| --- | --- |\n")
              summary.writelines(f"| `{name}` | {job['result']} |\n" for name, job in sorted(needs.items()))
          for name, result in sorted(failed.items()):
              print(f"::error::{name}: {result}")
          sys.exit(1 if failed else 0)
          PY
