      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd, xdebug
          coverage: xdebug
      - name: Constrain Laravel version
        run: echo "Temporary constraint laravel/framework:$LARAVEL_VERSION applies during dependency installation"
      - name: Constrain root Laravel version
        run: echo "Temporary constraint illuminate/contracts:$LARAVEL_VERSION applies during dependency installation"

      - name: Root Laravel 12 test stack
        if: matrix.laravel == '12.*'
        run: composer require --dev 'pestphp/pest:^4.7' --no-update --no-interaction

      - name: Laravel 12 test stack
        if: matrix.laravel == '12.*'
        run: composer --working-dir=packages/tools require --dev 'pestphp/pest:^4.7' --no-update --no-interaction

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install root tooling and shared test dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with "illuminate/contracts:$LARAVEL_VERSION"

      - name: Composer audit
        run: composer audit --locked

      - name: Install dependencies
        run: composer --working-dir=packages/tools update --prefer-dist --no-interaction --no-progress --with "laravel/framework:$LARAVEL_VERSION"

      - name: Composer audit
        run: composer audit --locked --working-dir=packages/tools
      - name: Tools tests and coverage
        run: composer --working-dir=packages/tools test:coverage
      - name: Tools static analysis
        run: composer --working-dir=packages/tools analyse

  webhooks-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12.*', '13.*']
    name: Webhooks package · Laravel ${{ matrix.laravel }}
    env:
      LARAVEL_VERSION: ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd, xdebug
          coverage: xdebug
      - name: Constrain Laravel version
        run: echo "Temporary constraint laravel/framework:$LARAVEL_VERSION applies during dependency installation"
      - name: Constrain root Laravel version
        run: echo "Temporary constraint illuminate/contracts:$LARAVEL_VERSION applies during dependency installation"

      - name: Root Laravel 12 test stack
        if: matrix.laravel == '12.*'
        run: composer require --dev 'pestphp/pest:^4.7' --no-update --no-interaction

      - name: Laravel 12 test stack
        if: matrix.laravel == '12.*'
        run: composer --working-dir=packages/webhooks require --dev 'pestphp/pest:^4.7' --no-update --no-interaction

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install root tooling and shared test dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with "illuminate/contracts:$LARAVEL_VERSION"

      - name: Composer audit
        run: composer audit --locked

      - name: Install dependencies
        run: composer --working-dir=packages/webhooks update --prefer-dist --no-interaction --no-progress --with "laravel/framework:$LARAVEL_VERSION"

      - name: Composer audit
        run: composer audit --locked --working-dir=packages/webhooks
      - name: Webhooks tests and coverage
        run: composer --working-dir=packages/webhooks test:coverage
      - name: Webhooks static analysis
        run: composer --working-dir=packages/webhooks analyse

  notifications-wakeup-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Notifications and wakeup packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
          coverage: none
      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --locked
      - name: Wakeup tests
        run: composer --working-dir=packages/wakeup test
      - name: Notification tests
        run: composer --working-dir=packages/notifications test
      - name: Notification and wakeup static analysis
        run: |
          composer --working-dir=packages/notifications analyse
          composer --working-dir=packages/wakeup analyse

  notifications-pg-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Notifications package (PG18)
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corex -d corex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
          coverage: none
      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --locked
      - name: PostgreSQL delivery admission test
        run: composer --working-dir=packages/notifications test:pg
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

  panels-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Panels package
    services:
      pgsql:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U corex -d corex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd, xdebug
          coverage: xdebug
      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install root tooling and shared test dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --locked

      - name: Install dependencies
        run: composer --working-dir=packages/panels update --prefer-dist --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --locked --working-dir=packages/panels
      - name: Panels SQLite tests
        run: composer --working-dir=packages/panels test -- --exclude-group=pg
      - name: Panels tests and coverage
        run: composer --working-dir=packages/panels test:coverage
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex
      - name: Panels static analysis
        run: composer --working-dir=packages/panels analyse

  media-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Media package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd, gd, xdebug
          coverage: xdebug
      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install root tooling and shared test dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --locked

      - name: Install dependencies
        run: composer --working-dir=packages/media update --prefer-dist --no-interaction --no-progress

      - name: Composer audit
