name: CI

on:
  push:
    branches: [main, p1r-remediation]
  pull_request:

permissions: {}

jobs:
  anti-weakening-gate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Anti-weakening gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Guard against gate-weakening diffs
        run: bash scripts/anti-weakening-gate.sh

  tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12.*', '13.*']
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    env:
      LARAVEL_VERSION: ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
          coverage: none

      - name: Constrain Laravel version
        run: echo "Temporary constraint illuminate/contracts:$LARAVEL_VERSION applies during dependency installation"

      - name: Laravel 12 test stack
        if: matrix.laravel == '12.*'
        run: composer require --dev 'pestphp/pest:^4.7' --no-update --no-interaction

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with "illuminate/contracts:$LARAVEL_VERSION"

      - name: Composer audit
        run: composer audit --locked

      - name: Tests
        run: composer test

  tests-pg:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12.*', '13.*']
        postgres: ['16', '18']
    name: PG lane (postgres:${{ matrix.postgres }}) · Laravel ${{ matrix.laravel }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corex -d corex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LARAVEL_VERSION: ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
          coverage: none

      - name: Constrain Laravel version
        run: echo "Temporary constraint illuminate/contracts:$LARAVEL_VERSION applies during dependency installation"

      - name: Laravel 12 test stack
        if: matrix.laravel == '12.*'
        run: composer require --dev 'pestphp/pest:^4.7' --no-update --no-interaction

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with "illuminate/contracts:$LARAVEL_VERSION"

      - name: Composer audit
        run: composer audit --locked

      - name: Prepare PostgreSQL test databases
        run: |
          for database in corex_test corex_search_a_test corex_search_b_test; do
            PGPASSWORD=corex psql -h 127.0.0.1 -U corex -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '${database}'" | grep -q 1 \
              || PGPASSWORD=corex psql -h 127.0.0.1 -U corex -d postgres -c "CREATE DATABASE ${database}"
          done

      - name: PG tests
        run: composer test:pg
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

  operations-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12.*', '13.*']
    name: Operations package · Laravel ${{ matrix.laravel }}
    env:
      LARAVEL_VERSION: ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd, xdebug
          coverage: xdebug
      - name: Constrain Laravel version
        run: echo "Temporary constraint laravel/framework:$LARAVEL_VERSION applies during dependency installation"
      - name: Constrain root Laravel version
        run: echo "Temporary constraint illuminate/contracts:$LARAVEL_VERSION applies during dependency installation"

      - name: Root Laravel 12 test stack
        if: matrix.laravel == '12.*'
        run: composer require --dev 'pestphp/pest:^4.7' --no-update --no-interaction

      - name: Laravel 12 test stack
        if: matrix.laravel == '12.*'
        run: composer --working-dir=packages/operations require --dev 'pestphp/pest:^4.7' --no-update --no-interaction

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install root tooling and shared test dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with "illuminate/contracts:$LARAVEL_VERSION"

      - name: Composer audit
        run: composer audit --locked

      - name: Install dependencies
        run: composer --working-dir=packages/operations update --prefer-dist --no-interaction --no-progress --with "laravel/framework:$LARAVEL_VERSION"

      - name: Composer audit
        run: composer audit --locked --working-dir=packages/operations
      - name: Operations tests and coverage
        run: composer --working-dir=packages/operations test:coverage
      - name: Operations static analysis
        run: composer --working-dir=packages/operations analyse

  tools-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12.*', '13.*']
    name: Tools package · Laravel ${{ matrix.laravel }}
    env:
