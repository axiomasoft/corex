name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  COMPOSER_ROOT_VERSION: dev-main

jobs:
  anti-weakening-gate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Anti-weakening gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Guard against gate-weakening diffs
        run: bash scripts/anti-weakening-gate.sh

  secret-scan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Secret scan (gitleaks)
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      - name: Secret scan gate
        run: GITLEAKS_BIN=/tmp/gitleaks bash scripts/secret-scan-gate.sh

      - name: Verify secret scan boundaries
        run: GITLEAKS_BIN=/tmp/gitleaks python3 -m unittest scripts.tests.test_secret_scan_gate

  tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['13.*']
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    env:
      LARAVEL_VERSION: ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
          coverage: none

      - name: Constrain Laravel version
        run: echo "Temporary constraint illuminate/contracts:$LARAVEL_VERSION applies during dependency installation"

      - name: Install dependencies
        run: php scripts/ci-composer-update.php --with "illuminate/contracts:$LARAVEL_VERSION"

      - name: Composer audit
        run: env -u COMPOSER_NO_AUDIT composer audit --locked

      - name: Tests
        run: composer test

      - name: Runtime globals gate
        run: composer runtime-globals-gate

      - name: Config cache check
        run: composer config-cache-check

      - name: Configuration reference
        run: composer configuration-reference

  octane-lifecycle:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    name: Octane source lifecycle · PHP ${{ matrix.php }} · Laravel 13
    env:
      OCTANE_PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
          coverage: none

      - name: Install locked Octane source consumer
        run: python3 scripts/composer-with-snapshots.py --working-dir=packages/core/tests/Release/octane-consumer update --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Audit Octane consumer lock
        run: env -u COMPOSER_NO_AUDIT python3 scripts/composer-with-snapshots.py --working-dir=packages/core/tests/Release/octane-consumer audit --locked

      - name: Receipt integrity controls
        run: python3 -m unittest discover -s scripts/quality/tests -p test_octane_proof.py

      - name: Real Octane Worker handlers
        run: python3 scripts/quality/octane-proof.py --source-root . --matrix "$OCTANE_PHP" --evidence-dir build/quality/octane

  tests-pg:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['13.*']
        postgres: ['16', '18']
    name: PG lane (postgres:${{ matrix.postgres }}) · Laravel ${{ matrix.laravel }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corex -d corex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LARAVEL_VERSION: ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
          coverage: none

      - name: Constrain Laravel version
        run: echo "Temporary constraint illuminate/contracts:$LARAVEL_VERSION applies during dependency installation"

      - name: Install dependencies
        run: php scripts/ci-composer-update.php --with "illuminate/contracts:$LARAVEL_VERSION"

      - name: Composer audit
        run: env -u COMPOSER_NO_AUDIT composer audit --locked

      - name: Prepare PostgreSQL test databases
        run: |
          for database in corex_test corex_search_a_test corex_search_b_test corex_budget_test corex_search_control_test; do
            PGPASSWORD=corex psql -h 127.0.0.1 -U corex -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '${database}'" | grep -q 1 \
              || PGPASSWORD=corex psql -h 127.0.0.1 -U corex -d postgres -c "CREATE DATABASE ${database}"
          done

      - name: PG tests
        run: composer test:pg
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_BUDGET_DATABASE: corex_budget_test
          PGSQL_CONTROL_DATABASE: corex_search_control_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

  operations-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['13.*']
    name: Operations package · Laravel ${{ matrix.laravel }}
    env:
      LARAVEL_VERSION: ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
