name: CI

on:
  push:
    branches: [main, p1r-remediation]
  pull_request:

jobs:
  anti-weakening-gate:
    runs-on: ubuntu-latest
    name: Anti-weakening gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard against gate-weakening diffs
        run: bash scripts/anti-weakening-gate.sh

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath
          coverage: none

      - name: Constrain Laravel version
        run: composer require "illuminate/contracts:${{ matrix.laravel }}" --no-update --no-interaction

      - name: Boxed profile (drop 8.4-only tenancy)
        if: matrix.php == '8.3'
        run: composer remove corex/tenancy --no-update --no-interaction

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Tests
        run: composer test

  tests-pg:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12.*', '13.*']
    name: PG lane (postgres:16) · Laravel ${{ matrix.laravel }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath
          coverage: none

      - name: Constrain Laravel version
        run: composer require "illuminate/contracts:${{ matrix.laravel }}" --no-update --no-interaction

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Prepare PostgreSQL test databases
        run: |
          for database in corex_test corex_search_a_test corex_search_b_test; do
            PGPASSWORD=corex psql -h 127.0.0.1 -U corex -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '${database}'" | grep -q 1 \
              || PGPASSWORD=corex psql -h 127.0.0.1 -U corex -d postgres -c "CREATE DATABASE ${database}"
          done

      - name: PG tests
        run: composer test:pg
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

  api-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12.*', '13.*']
    name: API package · Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, xdebug
          coverage: xdebug
      - name: Constrain Laravel version
        run: composer --working-dir=packages/api require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer --working-dir=packages/api update --prefer-dist --no-interaction --no-progress
      - name: API tests and coverage
        run: composer --working-dir=packages/api test:coverage
      - name: API static analysis
        run: composer --working-dir=packages/api analyse

  notifications-wakeup-tests:
    runs-on: ubuntu-latest
    name: Notifications and wakeup packages
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath
          coverage: none
      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Wakeup tests
        run: composer --working-dir=packages/wakeup test
      - name: Notification tests
        run: composer --working-dir=packages/notifications test
      - name: Notification and wakeup static analysis
        run: vendor/bin/phpstan analyse -c phpstan.neon packages/notifications/src packages/wakeup/src --memory-limit=1G

  notifications-pg-tests:
    runs-on: ubuntu-latest
    name: Notifications package (PG16)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, sqlite, pdo_sqlite, bcmath
          coverage: none
      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: PostgreSQL delivery admission test
        run: composer --working-dir=packages/notifications test:pg
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

  panels-tests:
    runs-on: ubuntu-latest
    name: Panels package
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, xdebug
          coverage: xdebug
      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer --working-dir=packages/panels update --prefer-dist --no-interaction --no-progress
      - name: Panels tests and coverage
        run: composer --working-dir=packages/panels test:coverage
      - name: Panels static analysis
        run: composer --working-dir=packages/panels analyse

  media-tests:
    runs-on: ubuntu-latest
    name: Media package
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, gd, xdebug
          coverage: xdebug
      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer --working-dir=packages/media update --prefer-dist --no-interaction --no-progress
      - name: Media tests and coverage
        run: composer --working-dir=packages/media test:coverage
      - name: Media static analysis
        run: composer --working-dir=packages/media analyse

  media-pg-tests:
    runs-on: ubuntu-latest
    name: Media package (PG16)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, sqlite, pdo_sqlite, bcmath
          coverage: none
      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer --working-dir=packages/media update --prefer-dist --no-interaction --no-progress
      - name: Media PostgreSQL concurrency test
        run: composer --working-dir=packages/media test:pg
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

  tenancy-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12.*', '13.*']
    name: Tenancy package (PG16) · Laravel ${{ matrix.laravel }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath
          coverage: none

      - name: Constrain Laravel version
        run: composer --working-dir=packages/tenancy require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer --working-dir=packages/tenancy update --prefer-dist --no-interaction --no-progress

      - name: Tenancy tests
        run: composer --working-dir=packages/tenancy test
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

      - name: PHPStan (tenancy/src)
        if: matrix.laravel == '13.*'
        run: composer --working-dir=packages/tenancy analyse

  crm-tests:
    runs-on: ubuntu-latest
    name: Crm package
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGSQL_PORT: 5432
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, xdebug
          coverage: xdebug

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer --working-dir=packages/crm update --prefer-dist --no-interaction --no-progress

      - name: Crm tests
        run: composer --working-dir=packages/crm test

      - name: Crm PostgreSQL regressions
        run: composer --working-dir=packages/crm test:pg

      - name: Crm coverage (P1.27 compensating gate)
        run: composer --working-dir=packages/crm test:coverage

  packages-tests:
    runs-on: ubuntu-latest
    name: Remaining cohort package aggregator
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, xdebug
          coverage: xdebug

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Per-package test aggregator
        run: composer test:packages

      - name: Core and modules suites
        run: vendor/bin/pest packages/core/tests packages/modules/tests

  tasks-tests:
    runs-on: ubuntu-latest
    name: Tasks package
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, xdebug
          coverage: xdebug

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer --working-dir=packages/tasks update --prefer-dist --no-interaction --no-progress

      - name: Tasks tests
        run: composer --working-dir=packages/tasks test

      - name: Tasks coverage (P1.27 compensating gate)
        run: composer --working-dir=packages/tasks test:coverage

  auth-tests:
    runs-on: ubuntu-latest
    name: Auth package (AzGuard)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath
          coverage: none

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer --working-dir=packages/auth update --prefer-dist --no-interaction --no-progress

      - name: Auth tests
        run: composer --working-dir=packages/auth test

      - name: Auth tests (PG16, aut_* DDL)
        run: composer --working-dir=packages/auth test:pg
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

      - name: PHPStan (auth/src)
        run: composer --working-dir=packages/auth analyse

  layer-gate:
    runs-on: ubuntu-latest
    name: Layer & core-isolation gate
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath
          coverage: none

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Architecture & layer rules (CoreX ↛ Flex, core isolation)
        run: composer test:arch

  contract-guard:
    runs-on: ubuntu-latest
    name: Contract-snapshot guard
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard src/Contracts changes against a CHANGELOG entry
        run: bash scripts/contract-guard.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  coverage:
    runs-on: ubuntu-latest
    name: Coverage (floor from scripts/coverage-min-floor.txt)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.16
        env:
          MEILI_NO_ANALYTICS: 'true'
          MEILI_ENV: development
        ports:
          - 7700:7700
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, xdebug
          coverage: xdebug

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Prepare PostgreSQL test databases
        run: |
          for database in corex_test corex_search_a_test corex_search_b_test; do
            PGPASSWORD=corex psql -h 127.0.0.1 -U corex -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '${database}'" | grep -q 1 \
              || PGPASSWORD=corex psql -h 127.0.0.1 -U corex -d postgres -c "CREATE DATABASE ${database}"
          done

      - name: Effective coverage floor
        run: |
          FLOOR="$(grep -m1 -E '^[0-9]+' scripts/coverage-min-floor.txt)"
          echo "Effective coverage floor (scripts/coverage-min-floor.txt): --min=${FLOOR}"
          echo "Return to --min=80 is time-gated item P1.27 (D47)."

      - name: Coverage
        run: composer test:coverage
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

  quality:
    runs-on: ubuntu-latest
    name: Static analysis & code style
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath
          coverage: none

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: composer analyse

      # Второй, самостоятельный прогон (P1.28/D48): 9 правил corex/modules-lint
      # на tests/ через phpstan-tests-lint.neon (без larastan — иначе Pest-идиома
      # даёт 60 несвязанных property.notFound). Строго ПОСЛЕ основного analyse.
      - name: PHPStan (modules-lint on tests/)
        run: composer analyse:tests-lint

      - name: Pint
        run: composer lint:check

  mutation-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    name: Mutation registry (scripts/mutation-check.sh --all)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # fetch-depth: 0 (D97): the 3-way fallback in mutation-check.sh needs the
      # pre-image blob of each patch's `index` line reachable in the object
      # database — the default shallow (depth-1) checkout doesn't carry it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath
          coverage: none

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Mutation registry — every case must red under sabotage
        run: bash scripts/mutation-check.sh --all
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex
