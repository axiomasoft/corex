      - name: Media static analysis
        run: composer --working-dir=packages/media analyse

  media-pg-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Media package (PG18)
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corex -d corex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
          coverage: none
      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install root tooling and shared test dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --locked

      - name: Install dependencies
        run: composer --working-dir=packages/media update --prefer-dist --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --locked --working-dir=packages/media
      - name: Media PostgreSQL concurrency test
        run: composer --working-dir=packages/media test:pg
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

  tenancy-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12.*', '13.*']
    name: Tenancy package (PG18) · Laravel ${{ matrix.laravel }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corex -d corex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LARAVEL_VERSION: ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
          coverage: none

      - name: Constrain Laravel version
        run: echo "Temporary constraint laravel/framework:$LARAVEL_VERSION applies during dependency installation"

      - name: Constrain root Laravel version
        run: echo "Temporary constraint illuminate/contracts:$LARAVEL_VERSION applies during dependency installation"

      - name: Root Laravel 12 test stack
        if: matrix.laravel == '12.*'
        run: composer require --dev 'pestphp/pest:^4.7' --no-update --no-interaction

      - name: Laravel 12 test stack
        if: matrix.laravel == '12.*'
        run: composer --working-dir=packages/tenancy require --dev 'pestphp/pest:^4.7' --no-update --no-interaction

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install root tooling and shared test dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with "illuminate/contracts:$LARAVEL_VERSION"

      - name: Composer audit
        run: composer audit --locked

      - name: Install dependencies
        run: composer --working-dir=packages/tenancy update --prefer-dist --no-interaction --no-progress --with "laravel/framework:$LARAVEL_VERSION"

      - name: Composer audit
        run: composer audit --locked --working-dir=packages/tenancy

      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Tenancy tests
        run: composer --working-dir=packages/tenancy test
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

      - name: PHPStan (tenancy/src)
        if: matrix.laravel == '13.*'
        run: composer --working-dir=packages/tenancy analyse

  crm-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Crm package
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corex -d corex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGSQL_PORT: 5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd, xdebug
          coverage: xdebug

      - name: Stage sealed stancl provider candidates
        run: python3 scripts/distribution/stage-stancl-providers.py

      - name: Install root tooling and shared test dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --locked

      - name: Install dependencies
        run: composer --working-dir=products/flex-crm update --prefer-dist --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --locked --working-dir=products/flex-crm

      - name: Crm tests
        run: composer --working-dir=products/flex-crm test

      - name: Crm PostgreSQL regressions
        run: composer --working-dir=products/flex-crm test:pg

      - name: Crm coverage (P1.27 compensating gate)
        run: composer --working-dir=products/flex-crm test:coverage

  packages-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Remaining cohort package aggregator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
