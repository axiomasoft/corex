      - name: Constrain Laravel version
        run: echo "Temporary constraint laravel/framework:$LARAVEL_VERSION applies during dependency installation"
      - name: Constrain root Laravel version
        run: echo "Temporary constraint illuminate/contracts:$LARAVEL_VERSION applies during dependency installation"

      - name: Install root tooling and shared test dependencies
        run: php scripts/ci-composer-update.php --with "illuminate/contracts:$LARAVEL_VERSION"

      - name: Composer audit
