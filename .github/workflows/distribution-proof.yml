name: Distribution proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'composer.*'
      - 'packages/**'
      - 'products/**'
      - 'fixtures/**'
      - 'tests/Distribution/**'
      - 'scripts/distribution/**'
      - 'scripts/migration/**'
      - '.github/workflows/distribution-proof.yml'

permissions: {}

jobs:
  profiles:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Archive profiles (PHP ${{ matrix.php }}, PostgreSQL ${{ matrix.postgres }})
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
          POSTGRES_DB: corex_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U corex -d corex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:v1.16@sha256:c0c45cb82a96221d7c855d1cc36ca04ff4b3ce6330fbd8df5ba82e86e632a053
        env:
          MEILI_MASTER_KEY: corex-stage4-disposable-meilisearch-key
          MEILI_NO_ANALYTICS: 'true'
          MEILI_ENV: development
        ports:
          - 7700:7700
    env:
      CANDIDATE: ${{ github.workspace }}/build/distribution/candidate
      EVIDENCE: ${{ github.workspace }}/build/distribution/evidence
      PHP_VERSION: ${{ matrix.php }}
      PG_MAJOR: ${{ matrix.postgres }}
      PGSQL_HOST: 127.0.0.1
      PGSQL_PORT: 5434
      PGSQL_USERNAME: corex
      PGSQL_PASSWORD: corex
      MEILISEARCH_HOST: http://127.0.0.1:7700
      MEILISEARCH_MASTER_KEY: corex-stage4-disposable-meilisearch-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
          coverage: none
          tools: composer
      - name: Build and validate the committed archive repository
        run: |
          mkdir -p "$EVIDENCE"
          curl --retry 20 --retry-all-errors --retry-delay 1 -fsS -H "Authorization: Bearer $MEILISEARCH_MASTER_KEY" "$MEILISEARCH_HOST/version" > "$EVIDENCE/meili-version.json"
          python3 scripts/distribution/release_candidate.py build --version 2.0.0 --output "$CANDIDATE" > "$EVIDENCE/candidate-build.json"
          python3 scripts/distribution/release_candidate.py verify --candidate "$CANDIDATE" > "$EVIDENCE/candidate-verify.json"
          cp "$CANDIDATE/candidate.json" "$EVIDENCE"
      - name: Prove isolated archive installations
        run: |
          python3 scripts/distribution/profile-proof.py --candidate "$CANDIDATE" --mode all --php "$PHP_VERSION" --receipt "$EVIDENCE/profile-receipt.json" --matrix "$EVIDENCE/profile-matrix.json"
          python3 scripts/distribution/prove_scenario.py --candidate "$CANDIDATE" --case installed-boot --php "$PHP_VERSION" --evidence-dir "$EVIDENCE/scenario"
      - name: Prove scoped workers, provider delivery, fields and search from installed archives
        run: |
          for scenario in worker-scope binding-restore workspace-sweep notification-visibility provider-unknown field-write ddl-claim search-rights generation; do
            python3 scripts/distribution/prove_scenario.py --candidate "$CANDIDATE" --case "$scenario" --php "$PHP_VERSION" --postgres "$PG_MAJOR" --evidence-dir "$EVIDENCE/scenarios/$scenario"
          done
      - name: Prove extension and equipment fixtures
        if: matrix.php == '8.4' && matrix.postgres == '18'
        run: |
          python3 scripts/distribution/verify_extension_fixtures.py --candidate "$CANDIDATE" --receipt "$EVIDENCE/extensions.json"
          python3 scripts/distribution/verify_equipment_consumer.py --candidate "$CANDIDATE" --receipt "$EVIDENCE/equipment.json"
      - name: Prove public and Octane installations
        if: matrix.postgres == '18'
        run: |
          python3 scripts/distribution/verify_installed_consumers.py --candidate "$CANDIDATE" --consumer public --php "$PHP_VERSION" --evidence-dir "$EVIDENCE/public-consumer"
          python3 scripts/distribution/verify_installed_consumers.py --candidate "$CANDIDATE" --consumer octane --php "$PHP_VERSION" --evidence-dir "$EVIDENCE/octane"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: distribution-php${{ matrix.php }}-pg${{ matrix.postgres }}
          path: ${{ env.EVIDENCE }}

  protocol-clients:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: External protocol clients
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove REST, MCP, bulk, and webhook wire contracts
        run: |
          python3 scripts/distribution/verify_api_clients.py
          python3 scripts/distribution/verify_async_clients.py

  offline-migration:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Frozen 1.x baseline and fresh 2.x migration prototype
    env:
      BASE_SHA: 1c11e0e35961409631cf68ebb28c7d2cd53ebb91
      BASE_CHECKOUT: ${{ github.workspace }}/build/distribution/corex-baseline
      BASE_DIST: ${{ github.workspace }}/build/distribution/corex-baseline-dist
      CANDIDATE: ${{ github.workspace }}/build/distribution/candidate
      EVIDENCE: ${{ github.workspace }}/build/distribution/migration-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, sqlite3, sodium, bcmath, curl, intl, zip, gd
          coverage: none
          tools: composer
      - name: Build immutable baseline with its original builder
        run: |
          git worktree add --detach "$BASE_CHECKOUT" "$BASE_SHA"
          cd "$BASE_CHECKOUT"
          python3 scripts/distribution/release_candidate.py build --version 1.0.0 --output "$BASE_DIST"
          python3 scripts/distribution/release_candidate.py verify --candidate "$BASE_DIST/candidate.json"
      - name: Run the importer against the frozen fixture and compare semantics
        run: |
          python3 scripts/distribution/release_candidate.py build --version 2.0.0 --output "$CANDIDATE"
          python3 scripts/distribution/upgrade-proof.py --candidate "$CANDIDATE" --baseline "$BASE_DIST" --evidence-dir "$EVIDENCE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: offline-migration
          path: ${{ env.EVIDENCE }}
