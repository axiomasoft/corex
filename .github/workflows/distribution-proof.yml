name: Distribution proof

on:
  workflow_dispatch:

permissions: {}

jobs:
  extension-fixtures:
    permissions:
      contents: read
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    name: External extension fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
          coverage: none
          tools: composer
      - name: Prove five standalone extension fixtures
        run: python3 scripts/distribution/verify_extension_fixtures.py

  api-clients:
    permissions:
      contents: read
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    name: External REST and MCP clients
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove REST and MCP parity against committed snapshots
        run: python3 scripts/distribution/verify_api_clients.py

  async-clients:
    permissions:
      contents: read
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    name: External bulk and webhook clients
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove bulk lifecycle and webhook verification
        run: python3 scripts/distribution/verify_async_clients.py

  equipment-consumer:
    permissions:
      contents: read
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    name: Equipment registry consumer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
          coverage: none
          tools: composer
      - name: Prove the equipment registry against the current candidate
        run: python3 scripts/distribution/verify_equipment_consumer.py

  install-profiles:
    permissions:
      contents: read
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    name: Pristine install profiles (${{ matrix.php }} ${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            mode: profiles
          - php: '8.5'
            mode: edges
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
          POSTGRES_DB: corex_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U corex -d corex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
          coverage: none
          tools: composer
      - name: Prove install profiles from the current candidate
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5434
          PROFILE_MODE: ${{ matrix.mode }}
          PHP_VERSION: ${{ matrix.php }}
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex
        run: python3 scripts/distribution/profile-proof.py --mode "$PROFILE_MODE" --php "$PHP_VERSION" --receipt "$RUNNER_TEMP/profile-receipt.json" --matrix "$RUNNER_TEMP/profile-matrix.json"

  upgrade-proof:
    permissions:
      contents: read
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    name: Supported-version upgrade proof
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
          POSTGRES_DB: corex_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U corex -d corex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
          coverage: none
          tools: composer
      - name: Prove named upgrade failures
        run: python3 -m unittest scripts.distribution.tests.test_upgrade_proof -q
      - name: Prove upgrade from pinned baselines
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5434
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/distribution/release_candidate.py build --version 1.0.0 --output build/distribution/candidate
          python3 scripts/distribution/upgrade-proof.py discover --candidate build/distribution/candidate --baselines "$RUNNER_TEMP/release-baselines.json"
          python3 scripts/distribution/upgrade-proof.py prove --candidate build/distribution/candidate --baselines "$RUNNER_TEMP/release-baselines.json" --receipt "$RUNNER_TEMP/upgrade-receipt.json"
