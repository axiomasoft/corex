name: Remaining cohort proof

on:
  workflow_dispatch:

permissions: {}

jobs:
  matrix-quality-sqlite:
    permissions:
      contents: read
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            laravel: '12'
          - php: '8.4'
            laravel: '13'
          - php: '8.5'
            laravel: '12'
          - php: '8.5'
            laravel: '13'
    name: Cohort sqlite php ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    env:
      LARAVEL_VERSION: ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite, pdo_sqlite, bcmath, curl, intl, zip, gd
          coverage: none

      - name: Constrain Laravel version
        run: composer require "illuminate/contracts:$LARAVEL_VERSION.*" --no-update --no-interaction

      - name: Laravel 12 test stack
        if: matrix.laravel == '12'
        run: composer require --dev 'pestphp/pest:^4.7' --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --locked

      - name: Platform requirements
        run: composer check-platform-reqs

      - name: Root tests
        run: composer test

  matrix-quality-pg:
    permissions:
      contents: read
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            laravel: '12'
          - php: '8.4'
            laravel: '13'
          - php: '8.5'
            laravel: '12'
          - php: '8.5'
            laravel: '13'
    name: Cohort pg18 php ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: corex_test
          POSTGRES_USER: corex
          POSTGRES_PASSWORD: corex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LARAVEL_VERSION: ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd
          coverage: none

      - name: Constrain Laravel version
        run: composer require "illuminate/contracts:$LARAVEL_VERSION.*" --no-update --no-interaction

      - name: Laravel 12 test stack
        if: matrix.laravel == '12'
        run: composer require --dev 'pestphp/pest:^4.7' --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --locked

      - name: Platform requirements
        run: composer check-platform-reqs

      - name: Prepare PostgreSQL test databases
        run: |
          for database in corex_test corex_search_a_test corex_search_b_test; do
            PGPASSWORD=corex psql -h 127.0.0.1 -U corex -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '${database}'" | grep -q 1 \
              || PGPASSWORD=corex psql -h 127.0.0.1 -U corex -d postgres -c "CREATE DATABASE ${database}"
          done

      - name: PostgreSQL tests
        run: composer test:pg
        env:
          PGSQL_HOST: 127.0.0.1
          PGSQL_PORT: 5432
          PGSQL_DATABASE: corex_test
          PGSQL_USERNAME: corex
          PGSQL_PASSWORD: corex

  local-matrix-receipt:
    permissions:
      contents: read
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    name: Local matrix receipt (structural)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, curl, intl, zip, gd, xdebug
          coverage: xdebug
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --locked
      - name: Build local matrix and runner plan
        run: |
          if [ -f delivery/remaining-cohort-20260915/candidate.json ]; then
            python3 scripts/distribution/remaining-cohort-quality.py
          else
            echo "skip: delivery artifacts absent on hosted runner"
          fi
