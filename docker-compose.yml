# Local services for the pg-lane tests (D12), matching the CI PG lane:
# PostgreSQL 18 with the lane's extra databases, and Meilisearch for the
# search adapter suite. sys_*/mod_* migrations need jsonb/ltree/BRIN/
# advisory locks that sqlite can't provide. No app service — this monorepo
# has no deployed app, only packages exercised by the test suite
# (`composer test:pg` / `pest --group=pg`). See docs/testing-ci.md for the
# environment variables.
services:
  pgsql:
    image: postgres:18-alpine
    container_name: corex_pgsql_test
    restart: unless-stopped
    ports:
      # Loopback only — not published to the network.
      - "127.0.0.1:${PGSQL_PORT:-5434}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18; the
      # volume name changed with the major version, so an old PostgreSQL 16
      # volume is left alone instead of failing to start.
      - corex_pgsql18_data:/var/lib/postgresql
      - ./docker/pgsql/create-test-databases.sh:/docker-entrypoint-initdb.d/10-create-test-databases.sh:ro
    environment:
      POSTGRES_DB: ${PGSQL_DATABASE:-corex_test}
      POSTGRES_USER: ${PGSQL_USERNAME:-corex}
      POSTGRES_PASSWORD: ${PGSQL_PASSWORD:-corex}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.16@sha256:c0c45cb82a96221d7c855d1cc36ca04ff4b3ce6330fbd8df5ba82e86e632a053
    container_name: corex_meilisearch_test
    restart: unless-stopped
    ports:
      # Loopback only — not published to the network.
      - "127.0.0.1:${MEILISEARCH_PORT:-7700}:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-corex-local-disposable-meilisearch-key}
      MEILI_NO_ANALYTICS: 'true'
      MEILI_ENV: development

volumes:
  corex_pgsql18_data:
